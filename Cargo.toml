[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/DrM7md/NuxOffice"
homepage = "https://github.com/DrM7md/NuxOffice"
authors = ["NuxOffice contributors"]
publish = false

[workspace.dependencies]
# Shared dependency versions go here once they are approved through an ADR
# and pass `cargo deny check`.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
