[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/DrM7md/NuxOffice"
homepage = "https://github.com/DrM7md/NuxOffice"
authors = ["NuxOffice contributors"]
publish = false

# Fuzz crates need nightly and libFuzzer; they are built with `cargo fuzz`,
# not as part of the workspace.
exclude = ["crates/cellnux-formulas/fuzz"]

[workspace.dependencies]
# Shared dependency versions. Add one only after a license check
# (`cargo deny check`) and a note in the PR.
cellnux-core = { path = "crates/cellnux-core" }
# proptest: MIT OR Apache-2.0. Property-based testing (blueprint 6.1).
proptest = { version = "1.6", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
