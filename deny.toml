# cargo-deny configuration: supply-chain and license policy.
# Run locally with `cargo install cargo-deny && cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# zip 3.0.0 is yanked but pinned by the upstream lockfile; updating it is left to upstream syncs.
yanked = "warn"

[licenses]
# Only licenses on this list may enter the dependency graph.
# Add a license here only after review, and explain it in the PR.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  # clipboard-win and error-code (via arboard): permissive, OSI approved.
  "BSL-1.0",
]
confidence-threshold = 0.9

# egui's built-in fonts (Ubuntu Light, Hack, emoji) ship under font licenses.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
# Upstream crates reference each other by workspace path without a version and are not
# marked publish = false, so the wildcard ban would only flag internal paths. External
# dependencies are reviewed in pull requests and pinned by Cargo.lock.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Upstream shared libraries, pinned to a commit in Cargo.lock.
allow-git = ["https://github.com/storytold/craft-libs"]
